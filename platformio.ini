; Smart Item Guardian - BCA182 Laboratory Activity 4
; RT-Thread RT-Spark (STM32F407ZGT6), STM32Cube HAL + FreeRTOS 10.3.1
;
; Board definition : boards/rt_spark_f407zg.json  (evidence: docs/hardware/board_manifest_verification.md)
; Linker script    : boards/ldscripts/rt_spark_f407zg.ld
; HAL config       : include/stm32f4xx_hal_conf.h (generated by tools/build/gen_hal_conf.py)
; FreeRTOS kernel  : lib/FreeRTOS-Kernel (V10.3.1, MIT), config include/FreeRTOSConfig.h

[platformio]
default_envs = rt_spark
boards_dir = boards

[env]
platform = ststm32@19.7.1
framework = stm32cube
board = rt_spark_f407zg
board_build.ldscript = boards/ldscripts/rt_spark_f407zg.ld
extra_scripts =
    pre:tools/build/fpu_flags.py
    pre:tools/build/upload_guard.py
lib_ldf_mode = chain+
build_flags =
    -std=gnu11
    -Wextra
    -Wno-unused-parameter
    -Isrc/bsp
    -Isrc/drivers
    -Isrc/app
    -Isrc/core
    -Isrc/model
; Upload/debug: on-board ST-LINK/V2.1 (STM32F103CB, schematic sheet 12) via OpenOCD.
; Uploading erases and programs only the sectors the image covers, then resets
; the MCU. Do not run it without explicit approval (see docs/hardware_sessions.md).
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF

[env:rt_spark]
build_type = release

; Same sources built with debug info (-Og -g3) for an approved SWD debugging session.
; Functionally identical; timing figures must come from the release env.
[env:rt_spark_debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DSIG_DEBUG_BUILD=1
